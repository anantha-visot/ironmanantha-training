name: Build APK
on:
  push:
    branches: [pulse-caller-app]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PulseCaller.apk
          gh release create "pulse-v1.${{ github.run_number }}" PulseCaller.apk --target "${{ github.sha }}" \
            --title "Pulse Caller build ${{ github.run_number }}" \
            --notes "Open this page on your Android phone and tap PulseCaller.apk to install." --latest=false
