plugins { id 'com.android.application' }

android {
    namespace 'io.visot.pulsecaller'
    compileSdk 34

    defaultConfig {
        applicationId 'io.visot.pulsecaller'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        debug {
            storeFile file('pulse-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
